
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lipi Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #1e1e1e;
    color: #cccccc;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

header {
    height: 42px;
    background: #181818;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
}

.logo {
    color: #42a5ff;
    font-size: 19px;
    font-weight: bold;
}

header span {
    color: #888;
    font-size: 12px;
}

.workspace {
    display: flex;
    height: calc(100vh - 66px);
}

.activity {
    width: 48px;
    background: #181818;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 15px;
    gap: 25px;
    color: #888;
}

.activity div {
    font-size: 19px;
}

.sidebar {
    width: 190px;
    background: #181818;
    border-right: 1px solid #333;
    padding: 15px 10px;
}

.sidebar h3 {
    font-size: 11px;
    font-weight: normal;
    color: #999;
    letter-spacing: 1px;
}

.file {
    padding: 9px;
    background: #252526;
    color: #ddd;
    font-size: 13px;
    border-radius: 3px;
    margin-top: 10px;
}

.file::before {
    content: "◇ ";
    color: #42a5ff;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.tab {
    height: 38px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 15px;
    border-bottom: 1px solid #333;
    font-size: 13px;
}

.tab span {
    color: #42a5ff;
    margin-right: 7px;
}

.toolbar {
    height: 42px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 12px;
    border-bottom: 1px solid #333;
}

.toolbar button {
    border: none;
    border-radius: 4px;
    padding: 7px 13px;
    cursor: pointer;
    color: white;
}

.run {
    background: #16834b;
}

.run:hover {
    background: #20a45f;
}

.download {
    background: #333;
}

.editor-area {
    display: flex;
    flex: 1;
    min-height: 0;
    background: #1e1e1e;
}

.numbers {
    width: 43px;
    padding: 15px 10px;
    text-align: right;
    color: #858585;
    background: #1e1e1e;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.7;
    overflow: hidden;
    user-select: none;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #9cdcfe;
    padding: 15px 10px;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.7;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

.bottom {
    height: 24px;
    background: #007acc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: white;
}

.preview {
    width: 38%;
    min-width: 220px;
    background: #181818;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
}

.preview-title {
    padding: 13px;
    font-size: 12px;
    color: #aaa;
    border-bottom: 1px solid #333;
}

#resultado {
    flex: 1;
    background: white;
    color: black;
    margin: 10px;
    padding: 20px;
    overflow: auto;
    border-radius: 4px;
}

.terminal {
    height: 95px;
    background: #181818;
    border-top: 1px solid #333;
    padding: 10px 15px;
    font-family: Consolas, monospace;
    font-size: 12px;
    overflow: auto;
}

.terminal-title {
    color: #aaa;
    margin-bottom: 10px;
}

#mensagem {
    color: #65d99b;
}

@media(max-width: 800px) {
    .sidebar {
        display: none;
    }

    .preview {
        width: 35%;
        min-width: 150px;
    }

    .activity {
        width: 38px;
    }
}

@media(max-width: 550px) {
    .workspace {
        flex-direction: column;
    }

    .activity {
        display: none;
    }

    .preview {
        width: 100%;
        height: 35%;
    }

    .main {
        min-height: 60%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Lipi Studio</div>
    <span>Editor de programação</span>
</header>

<div class="workspace">

    <aside class="activity">
        <div>▤</div>
        <div>⌕</div>
        <div>⚙</div>
    </aside>

    <aside class="sidebar">
        <h3>EXPLORADOR</h3>
        <div class="file">editor.lp</div>
    </aside>

    <section class="main">

        <div class="tab">
            <span>◇</span> editor.lp
        </div>

        <div class="toolbar">
            <button class="run" onclick="executar()">▶ Executar</button>
            <button class="download" onclick="baixar()">↓ Baixar .lp</button>
        </div>

        <div class="editor-area">
            <div class="numbers" id="numeros">1</div>

            <textarea id="codigo" spellcheck="false">site "Meu primeiro site"
fundo "#101020"
cor_texto "#ffffff"
titulo "Bem-vindo à Lipi!"
texto "Meu primeiro site feito com Lipi."
espacamento 20
arredondar 16
botao "Clique aqui"
animacao crescer
ao clicar:
    mostrar "Você executou a Lipi!"
fim</textarea>
        </div>

        <div class="terminal">
            <div class="terminal-title">TERMINAL</div>
            <div id="mensagem">Lipi Studio iniciado.</div>
        </div>

    </section>

    <section class="preview">
        <div class="preview-title">PRÉ-VISUALIZAÇÃO</div>
        <div id="resultado"></div>
    </section>

</div>

<div class="bottom">
    <span>● Lipi Studio</span>
    <span>UTF-8 | .lp</span>
</div>

<script>
const codigo = document.getElementById("codigo");
const resultado = document.getElementById("resultado");
const mensagem = document.getElementById("mensagem");
const numeros = document.getElementById("numeros");

function atualizarNumeros() {
    const quantidade = codigo.value.split("\n").length;
    numeros.textContent = Array.from(
        {length: quantidade},
        (_, i) => i + 1
    ).join("\n");
}

codigo.addEventListener("input", atualizarNumeros);

codigo.addEventListener("scroll", () => {
    numeros.scrollTop = codigo.scrollTop;
});

codigo.addEventListener("keydown", function(event) {
    if (event.key === "Tab") {
        event.preventDefault();

        const inicio = this.selectionStart;
        const fim = this.selectionEnd;

        this.value =
            this.value.substring(0, inicio) +
            "    " +
            this.value.substring(fim);

        this.selectionStart = this.selectionEnd = inicio + 4;

        atualizarNumeros();
    }
});

function pegarTexto(linha, comando) {
    return linha.slice(comando.length).trim()
        .replace(/^["']|["']$/g, "");
}

function executar() {

    resultado.replaceChildren();

    let animacao = "";
    let espacamento = 20;
    let arredondamento = 0;
    let ultimoBotao = null;
    let corFundo = "#ffffff";
    let corTexto = "#000000";

    const linhas = codigo.value.split("\n");

    function criar(tag, texto) {
        const elemento = document.createElement(tag);
        elemento.textContent = texto;
        resultado.appendChild(elemento);
        return elemento;
    }

    function numero(linha, comando, maximo) {
        const valor = Number(pegarTexto(linha, comando));

        if (!Number.isFinite(valor) || valor < 0 || valor > maximo) {
            throw new Error("Valor inválido em " + comando);
        }

        return valor;
    }

    try {

        for (let i = 0; i < linhas.length; i++) {

            const linha = linhas[i].trim();

            if (!linha || linha.startsWith("#")) continue;

            if (linha.startsWith("site ")) {
                resultado.dataset.nome = pegarTexto(linha, "site");
            }

            else if (linha.startsWith("fundo ")) {
                corFundo = pegarTexto(linha, "fundo");

                if (!CSS.supports("color", corFundo)) {
                    throw new Error("Cor de fundo inválida.");
                }
            }

            else if (linha.startsWith("cor_texto ")) {
                corTexto = pegarTexto(linha, "cor_texto");

                if (!CSS.supports("color", corTexto)) {
                    throw new Error("Cor do texto inválida.");
                }
            }

            else if (linha.startsWith("titulo ")) {
                criar("h1", pegarTexto(linha, "titulo"));
            }

            else if (linha.startsWith("texto ")) {
                criar("p", pegarTexto(linha, "texto"));
            }

            else if (linha.startsWith("botao ")) {
                ultimoBotao = criar("button", pegarTexto(linha, "botao"));
                ultimoBotao.type = "button";
                ultimoBotao.style.padding = "12px 20px";
                ultimoBotao.style.background = "#087cff";
                ultimoBotao.style.color = "white";
                ultimoBotao.style.border = "none";
                ultimoBotao.style.borderRadius = "6px";
                ultimoBotao.style.cursor = "pointer";
            }

            else if (linha.startsWith("imagem ")) {
                const url = pegarTexto(linha, "imagem");
                let endereco;

                try {
                    endereco = new URL(url);
                } catch {
                    throw new Error("Endereço de imagem inválido.");
                }

                if (endereco.protocol !== "https:") {
                    throw new Error("A imagem precisa usar HTTPS.");
                }

                const img = document.createElement("img");
                img.src = endereco.href;
                img.alt = "Imagem Lipi";
                img.style.maxWidth = "100%";
                resultado.appendChild(img);
            }

            else if (linha.startsWith("espacamento ")) {
                espacamento = numero(linha, "espacamento", 200);
            }

            else if (linha.startsWith("arredondar ")) {
                arredondamento = numero(linha, "arredondar", 100);
            }

            else if (linha === "animacao crescer") {
                animacao = "crescer";
            }

            else if (linha === "animacao brilhar") {
                animacao = "brilhar";
            }

            else if (linha === "ao clicar:") {

                if (!ultimoBotao) {
                    throw new Error("Crie um botao antes de ao clicar.");
                }

                let texto = "";
                let encontrouFim = false;

                for (let j = i + 1; j < linhas.length; j++) {
                    const interna = linhas[j].trim();

                    if (interna === "fim") {
                        encontrouFim = true;
                        i = j;
                        break;
                    }

                    if (interna.startsWith("mostrar ")) {
                        texto = pegarTexto(interna, "mostrar");
                    } else if (interna !== "") {
                        throw new Error("Comando inválido dentro do bloco.");
                    }
                }

                if (!encontrouFim) {
                    throw new Error("Está faltando o comando fim.");
                }

                ultimoBotao.addEventListener("click", () => alert(texto));
            }

            else {
                throw new Error("Comando desconhecido: " + linha);
            }
        }

        resultado.style.background = corFundo;
        resultado.style.color = corTexto;
        resultado.style.padding = espacamento + "px";
        resultado.style.borderRadius = arredondamento + "px";

        resultado.querySelectorAll("button").forEach(botao => {

            if (animacao === "crescer") {
                botao.addEventListener("mouseenter", () => {
                    botao.style.transform = "scale(1.12)";
                });

                botao.addEventListener("mouseleave", () => {
                    botao.style.transform = "scale(1)";
                });
            }

            if (animacao === "brilhar") {
                botao.style.boxShadow = "0 0 15px #168cff";
            }
        });

        mensagem.textContent = "> Lipi executada com sucesso!";
        mensagem.style.color = "#65d99b";

    } catch (erro) {
        resultado.replaceChildren();
        mensagem.textContent = "> ERRO: " + erro.message;
        mensagem.style.color = "#ff6868";
    }
}

function baixar() {
    const arquivo = new Blob([codigo.value], {
        type: "text/plain;charset=utf-8"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(arquivo);
    link.download = "meu-projeto.lp";
    link.click();

    URL.revokeObjectURL(link.href);
}

atualizarNumeros();
executar();
</script>

</body>
</html>
