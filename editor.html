
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lipi — Editor Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d19;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px 25px;
    background: #101a2d;
    border-bottom: 1px solid #263650;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #38a5ff;
    font-size: 25px;
    font-weight: bold;
}

.status {
    color: #65d99b;
    font-size: 13px;
}

main {
    padding: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

h2 {
    font-size: 17px;
    color: #8fcaff;
}

textarea {
    width: 100%;
    height: 420px;
    resize: vertical;
    background: #101a2d;
    color: #b9e2ff;
    border: 1px solid #294568;
    border-radius: 10px;
    padding: 18px;
    font-family: Consolas, monospace;
    font-size: 15px;
    outline: none;
    line-height: 1.6;
}

textarea:focus {
    border-color: #168cff;
    box-shadow: 0 0 12px #087cff55;
}

button {
    background: #087cff;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

#executar {
    margin-top: 12px;
    font-size: 14px;
}

#preview {
    background: white;
    color: black;
    min-height: 420px;
    border-radius: 10px;
    overflow: auto;
    padding: 20px;
}

#mensagem {
    font-size: 13px;
    margin-top: 12px;
}

footer {
    padding: 20px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
}

@media(max-width: 750px) {
    main {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Lipi.</div>
    <div class="status">Editor Online</div>
</header>

<main>

<section>
    <h2>Editor .lp</h2>

<textarea id="codigo" spellcheck="false">site "Meu primeiro site"
fundo "#101020"
cor_texto "#ffffff"
titulo "Bem-vindo à Lipi!"
texto "Meu primeiro site feito com Lipi."
espacamento 20
arredondar 16
botao "Clique aqui"
animacao crescer
ao clicar:
    mostrar "Você executou a Lipi!"
fim</textarea>

<button id="executar" type="button">▶ Executar Lipi</button>

<div id="mensagem">Pronto para executar.</div>
</section>

<section>
    <h2>Pré-visualização</h2>
    <div id="preview"></div>
</section>

</main>

<footer>
    Lipi — Sua linguagem, suas ideias.
</footer>

<script>
const codigo = document.getElementById("codigo");
const preview = document.getElementById("preview");
const mensagem = document.getElementById("mensagem");

function executar() {

    preview.replaceChildren();

    let animacao = "";
    let espacamento = 20;
    let arredondamento = 0;
    let ultimoBotao = null;

    const linhas = codigo.value.split("\n");

    function pegarTexto(linha, comando) {
        return linha.slice(comando.length).trim()
            .replace(/^["']|["']$/g, "");
    }

    function numero(valor, comando, maximo) {
        const n = Number(pegarTexto(valor, comando));

        if (!Number.isFinite(n) || n < 0 || n > maximo) {
            throw new Error("Valor inválido em " + comando);
        }

        return n;
    }

    function criar(tag, texto) {
        const elemento = document.createElement(tag);
        elemento.textContent = texto;
        preview.appendChild(elemento);
        return elemento;
    }

    function corValida(cor) {
        return CSS.supports("color", cor);
    }

    try {

        for (let i = 0; i < linhas.length; i++) {

            const linha = linhas[i].trim();

            if (!linha || linha.startsWith("#")) {
                continue;
            }

            if (linha.startsWith("site ")) {
                preview.dataset.nome = pegarTexto(linha, "site");
            }

            else if (linha.startsWith("fundo ")) {
                const cor = pegarTexto(linha, "fundo");

                if (!corValida(cor)) {
                    throw new Error("Cor de fundo inválida.");
                }

                preview.style.background = cor;
            }

            else if (linha.startsWith("cor_texto ")) {
                const cor = pegarTexto(linha, "cor_texto");

                if (!corValida(cor)) {
                    throw new Error("Cor do texto inválida.");
                }

                preview.style.color = cor;
            }

            else if (linha.startsWith("titulo ")) {
                criar("h1", pegarTexto(linha, "titulo"));
            }

            else if (linha.startsWith("texto ")) {
                criar("p", pegarTexto(linha, "texto"));
            }

            else if (linha.startsWith("botao ")) {

                ultimoBotao = criar(
                    "button",
                    pegarTexto(linha, "botao")
                );

                ultimoBotao.type = "button";
                ultimoBotao.style.margin = "5px";
            }

            else if (linha.startsWith("imagem ")) {

                const url = pegarTexto(linha, "imagem");

                let endereco;

                try {
                    endereco = new URL(url);
                } catch {
                    throw new Error("Endereço da imagem inválido.");
                }

                if (endereco.protocol !== "https:") {
                    throw new Error("A imagem precisa usar HTTPS.");
                }

                const img = document.createElement("img");
                img.src = endereco.href;
                img.alt = "Imagem Lipi";
                img.style.maxWidth = "100%";
                img.style.display = "block";

                preview.appendChild(img);
            }

            else if (linha.startsWith("espacamento ")) {
                espacamento = numero(linha, "espacamento", 200);
            }

            else if (linha.startsWith("arredondar ")) {
                arredondamento = numero(linha, "arredondar", 100);
            }

            else if (linha === "animacao crescer") {
                animacao = "crescer";
            }

            else if (linha === "animacao brilhar") {
                animacao = "brilhar";
            }

            else if (linha === "ao clicar:") {

                if (!ultimoBotao) {
                    throw new Error(
                        "Crie um botao antes de usar ao clicar."
                    );
                }

                let encontrouFim = false;
                let mensagemClique = "";

                for (let j = i + 1; j < linhas.length; j++) {

                    const interna = linhas[j].trim();

                    if (interna === "fim") {
                        encontrouFim = true;
                        i = j;
                        break;
                    }

                    if (interna.startsWith("mostrar ")) {
                        mensagemClique = pegarTexto(
                            interna,
                            "mostrar"
                        );
                    } else if (interna !== "") {
                        throw new Error(
                            "Comando inválido dentro de ao clicar."
                        );
                    }
                }

                if (!encontrouFim) {
                    throw new Error("Está faltando o comando fim.");
                }

                const botaoAtual = ultimoBotao;
                const texto = mensagemClique;

                botaoAtual.addEventListener("click", function() {
                    alert(texto);
                });
            }

            else {
                throw new Error("Comando desconhecido: " + linha);
            }
        }

        preview.style.padding = espacamento + "px";
        preview.style.borderRadius = arredondamento + "px";

        preview.querySelectorAll("button").forEach(botao => {

            if (animacao === "crescer") {

                botao.addEventListener("mouseenter", () => {
                    botao.style.transform = "scale(1.12)";
                });

                botao.addEventListener("mouseleave", () => {
                    botao.style.transform = "scale(1)";
                });
            }

            if (animacao === "brilhar") {
                botao.style.boxShadow = "0 0 15px #168cff";
            }
        });

        mensagem.textContent = "Lipi executada com sucesso!";
        mensagem.style.color = "#65d99b";

    } catch (erro) {

        preview.replaceChildren();

        mensagem.textContent = "Erro: " + erro.message;
        mensagem.style.color = "#ff6868";
    }
}

document.getElementById("executar")
    .addEventListener("click", executar);

executar();
</script>

</body>
</html>
